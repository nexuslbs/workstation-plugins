# Publish the BROWSER SERVICE image of the workstation project to GitHub Container Registry.
#
# TRIGGERS / TAG POLICY (the operator's spec):
#   * push of tag `browser-X.Y.Z` -> ghcr.io/nexuslbs/workstation-plugins/browser:X.Y.Z AND :latest
#
# A `browser-*` tag is the ONLY trigger: this workflow builds nothing on a
# branch push and nothing on a `v*` (core) tag. The image tag is the git tag with
# the `browser-` prefix stripped (`browser-0.0.1` -> `.../browser:0.0.1`).
#
# The image is a SEPARATE artifact from the workbench core image
# (`ghcr.io/nexuslbs/workbench`, published by nexuslbs/workbench): it carries NO
# workbench code and NO workbench dependency, only chromium + the `start-browser`
# entrypoint (see browser/README.md). The core image stays browser-free.
#
# The image is built ONCE, smoke-tested, and only then pushed - the pushed image is
# the tested one. The smoke steps assert the ACTUAL live-view contract of the
# passwordless, on-demand design: the CDP endpoint answers /json/version; with
# BROWSER_VNC unset the live view must NOT be listening on 8080 (OFF by default);
# the entrypoint must contain `-nopw` and must NOT read BROWSER_VNC_PASSWORD;
# `start-browser vnc-start` must serve /vnc.html with 200 and `vnc-stop` must close
# the listeners again (no stack recreate, no password); and a container started with
# BROWSER_VNC=1 serves /vnc.html at boot through the same code path.
#
# Auth: GHCR only via the workflow's own GITHUB_TOKEN (`packages: write`).
# No PAT, no app key, no secret is referenced or committed anywhere here.
name: browser publish

on:
  push:
    tags:
      - 'browser-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: browser-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # The artifact of THIS repository: <repository>/browser.
  IMAGE: ghcr.io/nexuslbs/workstation-plugins/browser

jobs:
  publish:
    name: Build, smoke-test and publish the browser service image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the image version from the tag
        id: version
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          case "$REF" in
            browser-*) VERSION="${REF#browser-}" ;;
            *)
              echo "::error::ref '$REF' is not a browser-* tag; this workflow publishes only browser-* tags"
              exit 1 ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$REF' does not carry a version (expected browser-X.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing ${IMAGE}:${VERSION} and ${IMAGE}:latest"

      - name: Build the browser service (no push)
        run: |
          set -euo pipefail
          docker build -t "$IMAGE:local" browser
          docker image inspect --format '{{.Id}} {{.RepoTags}}' "$IMAGE:local"

      # The image is only worth publishing if the CDP endpoint it promises really
      # answers: run it and require /json/version. A build-only job would publish
      # an image nobody knows is usable.
      - name: Smoke-test the built image (CDP must answer)
        run: |
          set -euo pipefail
          docker run -d --name browser-smoke -p 9222:9222 "$IMAGE:local"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9222/json/version > /tmp/version.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          cat /tmp/version.json 2>/dev/null || true
          echo
          docker logs browser-smoke 2>&1 | tail -n 20 || true
          docker rm -f browser-smoke >/dev/null 2>&1 || true
          test "$ok" = "1" || { echo "::error::the browser image never answered on the CDP endpoint /json/version"; exit 1; }
          grep -q '"Browser"' /tmp/version.json
          echo "OK: the browser service answers CDP on 127.0.0.1:9222"

      # THE LIVE VIEW (browser-0.0.4+): OFF by default and ON DEMAND, with NO password
      # of our own (`x11vnc -nopw`; the tunnel hostname must sit behind a Cloudflare
      # Access policy). The image must start the stream at RUNTIME - no recreate - and
      # stop it again, leaving no listener behind.
      - name: Smoke-test the live view is ON DEMAND (vnc-start / vnc-stop, no password)
        run: |
          set -euo pipefail
          docker run -d --name browser-vnc-smoke -p 9222:9222 -p 8080:8080 "$IMAGE:local"
          ok=0
          for i in $(seq 1 60); do
            if [ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9222/json/version 2>/dev/null || true)" = "200" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = "1" || { docker logs browser-vnc-smoke 2>&1 | tail -n 20 || true; docker rm -f browser-vnc-smoke >/dev/null 2>&1 || true; echo "::error::the browser service never answered CDP"; exit 1; }
          # OFF at boot (BROWSER_VNC unset): the live view must NOT be listening.
          if curl -sS --max-time 3 -o /dev/null http://127.0.0.1:8080/vnc.html 2>/dev/null; then
            echo "::error::the live view answered although BROWSER_VNC was not set (it must be OFF by default)"; exit 1
          fi
          # the image ships the passwordless path and reads no password at all
          docker exec browser-vnc-smoke sh -c 'grep -q -- "-nopw" /usr/local/bin/start-browser'
          if docker exec browser-vnc-smoke sh -c 'grep -q BROWSER_VNC_PASSWORD /usr/local/bin/start-browser'; then
            echo "::error::the entrypoint still reads BROWSER_VNC_PASSWORD"; exit 1
          fi
          docker exec browser-vnc-smoke start-browser vnc-status
          # ... the runtime switch turns it ON: no stack recreate, no password.
          docker exec browser-vnc-smoke start-browser vnc-start
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/vnc.html)" = "200" || { echo "::error::vnc-start did not serve the noVNC page on 8080"; exit 1; }
          curl -sS -o /dev/null -w 'GET / -> %{http_code}\n' http://127.0.0.1:8080/ || true
          # ... and turns it OFF again: the listeners must be GONE.
          docker exec browser-vnc-smoke start-browser vnc-stop
          sleep 1
          if curl -sS --max-time 3 -o /dev/null http://127.0.0.1:8080/vnc.html 2>/dev/null; then
            echo "::error::vnc-stop left the noVNC page answering"; exit 1
          fi
          docker logs browser-vnc-smoke 2>&1 | grep -iE 'live view|novnc|x11vnc|websockify' || true
          docker rm -f browser-vnc-smoke >/dev/null 2>&1 || true
          echo "OK: live view OFF by default, vnc-start served noVNC, vnc-stop closed the listeners (no password, no recreate)"

      # ... and BROWSER_VNC=1 starts the same thing at boot (one code path, two entries).
      - name: Smoke-test the live view at boot (BROWSER_VNC=1 serves noVNC on 8080)
        run: |
          set -euo pipefail
          docker run -d --name browser-vnc-boot -e BROWSER_VNC=1 -p 8080:8080 "$IMAGE:local"
          ok=0
          for i in $(seq 1 60); do
            if [ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/vnc.html 2>/dev/null || true)" = "200" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ 2>/dev/null || true)"
          echo "GET / -> $code"
          docker logs browser-vnc-boot 2>&1 | grep -iE 'live view|novnc|x11vnc|websockify' || true
          docker rm -f browser-vnc-boot >/dev/null 2>&1 || true
          test "$ok" = "1" || { echo "::error::BROWSER_VNC=1 did not serve the noVNC page on 8080"; exit 1; }
          test "$code" = "200" || { echo "::error::the live-view landing page did not answer"; exit 1; }
          echo "OK: BROWSER_VNC=1 serves noVNC at boot with no password of our own"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push the SAME tested image
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          docker tag "$IMAGE:local" "$IMAGE:$VERSION"
          docker tag "$IMAGE:local" "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker image inspect --format '{{.Id}}' "$IMAGE:$VERSION"
          echo "pushed ${IMAGE}:${VERSION} and ${IMAGE}:latest"
